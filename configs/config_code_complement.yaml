# OmniSVG stage-2 inference config for SVG code-complement.
# This keeps the 4B token layout aligned with config_zhuan.yaml, while matching
# the stage-2 training image size and code-complement generation defaults.

default_model_size: "4B"

# ==============================================================================
# Model-specific configurations
# ==============================================================================
models:
  "4B":
    tokens:
      num_mask_and_eom: 151938
      mask: 151937
      eom: 151938
      base_offset: 151936
    coordinates:
      pix_pad_offset: 151943
      coord_pad_offset: 151943
    colors:
      color_start_offset: 191946
      color_end_offset: 196044
    model:
      vocab_size: 197000
    huggingface:
      qwen_model: "/data/phd23_weiguang_zhang/works/svg/qwen25vl3b"
      omnisvg_model: "OmniSVG/OmniSVG1.1_4B"

# ==============================================================================
# Shared tokenization settings
# ==============================================================================
tokens:
  num_end_token: 5
  causal_pad: 3
  svg_end: 1

coordinates:
  bbox: 200

colors:
  cmd_fill: 40010
  color_token_start: 40010
  max_color_tokens: 4098
  default_color_token: 40010
  black_color_token: 40012

svg_commands:
  move: -5
  line: -4
  curve: -3
  arc: -2
  close: -1

arc:
  param_offset: 44500
  param_range: 100

# ==============================================================================
# Generation settings
# ==============================================================================
model:
  bos_token_id: 196998
  eos_token_id: 196999
  pad_token_id: 151643
  # Max generated completion tokens. Override with --max-length if needed.
  max_length: 1024

text:
  # The code-complement prompt is intentionally short; partial SVG is passed as
  # SVG tokens via --condition-max-length instead of text tokens.
  max_length: 128

image:
  # Match configs/train_config_code_complement.yaml.
  target_size: 448
  render_size: 1024
  background_threshold: 240
  empty_threshold_illustration: 250
  empty_threshold_icon: 252
  edge_sample_ratio: 0.1
  color_similarity_threshold: 30
  min_edge_samples: 10

task_configs:
  code_complement:
    default_temperature: 0.01 # 0.3
    default_top_p: 1.0 # 0.90
    default_top_k: 1 # 50
    default_repetition_penalty: 1.03 # 1.05

generation:
  default_num_candidates: 1
  max_num_candidates: 8
  extra_candidates_buffer: 4

validation:
  min_svg_length: 20
