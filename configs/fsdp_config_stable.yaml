# FSDP Configuration - balanced setup for Qwen2.5-VL/OmniSVG
#
# Wrap the same block classes that Qwen2.5-VL marks as no-split modules. This is
# more efficient than size-based wrapping and avoids tiny/irregular FSDP units.

compute_environment: LOCAL_MACHINE
distributed_type: FSDP

fsdp_config:
  fsdp_auto_wrap_policy: TRANSFORMER_BASED_WRAP
  fsdp_transformer_layer_cls_to_wrap: Qwen2_5_VLDecoderLayer,Qwen2_5_VLVisionBlock

  # Full sharding gives the main DDP memory savings: parameters, gradients, and
  # optimizer states are sharded across GPUs.
  fsdp_sharding_strategy: FULL_SHARD

  # Keep backward prefetch for throughput. If GPU memory is still too high, try
  # BACKWARD_POST before enabling CPU offload.
  fsdp_backward_prefetch: BACKWARD_PRE
  fsdp_forward_prefetch: false

  # Sharded saves avoid gathering the full model onto rank0 during checkpointing.
  fsdp_state_dict_type: SHARDED_STATE_DICT

  # Each rank loads the same local checkpoint before FSDP wrapping, so avoid the
  # extra rank0 broadcast/loading path.
  fsdp_sync_module_states: false
  fsdp_cpu_ram_efficient_loading: false

  # Avoid exposing empty original-parameter shards to Qwen2.5-VL modules during
  # recomputation. This is the key difference from the previous performance config.
  fsdp_use_orig_params: false

  # Keep params on GPU for speed. If this still OOMs, change this to true.
  fsdp_offload_params: false

  # Do not combine FSDP activation checkpointing with model gradient checkpointing.
  # The model config enables HuggingFace's checkpointing instead.
  fsdp_activation_checkpointing: false

mixed_precision: bf16
downcast_bf16: 'no'

num_processes: 4
gpu_ids: all
use_cpu: false

num_machines: 1
machine_rank: 0
main_process_ip: null
main_process_port: null

main_training_function: main
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
